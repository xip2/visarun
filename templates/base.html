{% load static %}

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Visarun{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'main/table.css' %}">
    {% block extra_head %}{% endblock %}
    <script src="https://unpkg.com/htmx.org@2.0.7"></script>
</head>
<body>
<header class="header">
    <div class="header-container">

        <a href="/" class="logo">
            <span class="logo-icon">🌍</span>
            <span class="logo-text">Visarun</span>
        </a>

        <nav class="nav">
            <a href="{% url 'countries' %}">Страны</a>
            <a href="{% url 'map' %}">Карта</a>
            <a href="{% url 'help' %}">Справка</a>
        </nav>

    </div>
</header>
    {% block content %}{% endblock %}
    <script src="{% static 'main/table.js' %}"></script>
</body>
</html>
