{% extends "base.html" %}

{% block content %}
<div class="content">

    <div class="layout">

        <aside class="sidebar">
            <form
                id="filters"
                hx-get="/"
                hx-trigger="input changed delay:250ms, change"
                hx-target="#countries-table"
                hx-swap="innerHTML"
            >
                <input type="hidden" id="sort-field" name="sort" value="{{ sort_key }}">
                <input type="hidden" id="dir-field" name="dir" value="{{ sort_dir }}">

                <div class="filters">

                    <fieldset>
                        <legend>Тип визы</legend>

                        <label>
                            <input type="checkbox" name="visa_free">
                            Visa Free
                        </label>

                        <label>
                            <input type="checkbox" name="evisa">
                            eVisa
                        </label>

                        <label>
                            <input type="checkbox" name="eta">
                            eTA
                        </label>
                    </fieldset>

                    <fieldset>
                        <legend>Регион</legend>

                        <label>
                            <input type="checkbox" name="sea">
                            ЮВА
                        </label>

                        <label>
                            <input type="checkbox" name="latam">
                            Латинская Америка
                        </label>

                        <label>
                            <input type="checkbox" name="eastern_europe">
                            Восточная Европа
                        </label>

                        <label>
                            <input type="checkbox" name="europe">
                            Европа
                        </label>
                    </fieldset>

                    <fieldset>
                        <legend>Объединения стран</legend>

                        <label>
                            <input type="checkbox" name="schengen">
                            Шенген
                        </label>

                        <label>
                            <input type="checkbox" name="cis">
                            СНГ
                        </label>
                    </fieldset>

                    <label class="search-box">
                        Поиск страны:
                        <input
                            type="text"
                            name="search"
                            placeholder="Первые буквы страны..."
                        >
                    </label>

                </div>
            </form>
        </aside>


<div class="table-wrapper" id="countries-table">
    {% include "countries_table.html" %}
</div>

    </div>

</div>
{% endblock %}
