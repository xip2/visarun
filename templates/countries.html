{% extends "base.html" %}

{% block content %}

<div class="table-wrapper">
    <table class="visa-table">
        <thead>
            <tr>
                <th>Страна</th>
                <th>Тип визы</th> <!-- безвиз, evisa, виза по прибытии, Visa -->
                <th>Кол-во дней без визы</th> <!-- Чистое количество  -->
                <th>Комментарии</th>
            </tr>
        </thead>

      <tbody>
    {% for rule in rules %}
    <tr>
        <td>{{ rule.name }}</td>
        <td>{{ rule.slug }}</td>
        <td>{{ rule.group_names|default:"-" }}</td>
        <td>апрвр</td>
    </tr>
    {% endfor %}
</tbody>
    </table>
</div>

{% endblock %}
